[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediabuyerbench"
version = "0.1.0"
description = "Open benchmark for evaluating AI systems as senior paid media buyers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NotFair" }]
keywords = ["benchmark", "eval", "advertising", "media-buying", "llm", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
mediabuyerbench = "mediabuyerbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mediabuyerbench*"]
